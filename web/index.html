<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentStat - 开发者 AI 效能与 Token 深度看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- React 18 + ReactDOM + Babel + ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #111622;
      --bg-surface-elevated: #161d2d;
      --bg-surface-hover: #1c2438;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-focus: #3b82f6;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-violet: #a855f7;
      --accent-cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: #232d42;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 28px 60px 28px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1e3a8a, #0ea5e9);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .status-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-medium);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* Filter Segments */
    .segmented-control {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .segmented-item {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .segmented-item.active {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
    }
    .kpi-card:hover {
      border-color: var(--border-medium);
      transform: translateY(-1px);
    }
    .kpi-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .kpi-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .kpi-icon {
      font-size: 16px;
      opacity: 0.8;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .kpi-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .kpi-subtext {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kpi-highlight {
      color: var(--accent-emerald);
      font-weight: 600;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .nav-tab-item {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab-item:hover {
      color: var(--text-primary);
    }
    .nav-tab-item.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      font-weight: 600;
    }
    .tab-badge {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 9999px;
    }
    .nav-tab-item.active .tab-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }

    /* Card Panels */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    /* Chart Containers */
    .chart-box {
      width: 100%;
      height: 350px;
    }
    .chart-box-lg {
      width: 100%;
      height: 420px;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th {
      padding: 10px 14px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      white-space: nowrap;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: var(--bg-surface-elevated);
    }

    /* Badges & Tags */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .badge-blue {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .badge-purple {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .badge-emerald {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-rose {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    /* Search & Filter Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-input {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      min-width: 260px;
      flex: 1;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
    }
    .select-input {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    /* Progress bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #38bdf8, #10b981);
    }

    /* Empty state */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Session card */
    .session-item {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.15s;
    }
    .session-item:hover {
      border-color: var(--border-medium);
      background: var(--bg-surface-hover);
    }
    .session-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .session-metrics {
      display: flex;
      gap: 16px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }
    .session-metric-val {
      font-weight: 600;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // 格式化大数值辅助函数
    function formatNumber(num) {
      if (num === null || num === undefined) return '0';
      return Number(num).toLocaleString('zh-CN');
    }

    function formatTokens(tokens) {
      if (!tokens) return '0';
      const n = Number(tokens);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + ' B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + ' M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + ' K';
      return n.toString();
    }

    // ECharts React 组件封装
    function EChartComponent({ option, style, height = '350px' }) {
      const chartRef = useRef(null);
      const instanceRef = useRef(null);

      useEffect(() => {
        if (!chartRef.current || !window.echarts) return;
        if (!instanceRef.current) {
          instanceRef.current = window.echarts.init(chartRef.current, 'dark', {
            renderer: 'canvas'
          });
        }
        if (option) {
          instanceRef.current.setOption(option, true);
        }

        const handleResize = () => {
          if (instanceRef.current) instanceRef.current.resize();
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
        };
      }, [option]);

      return <div ref={chartRef} style={{ width: '100%', height, ...style }} />;
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [period, setPeriod] = useState('day'); // 'day', 'week', 'month'
      const [activeTab, setActiveTab] = useState('efficiency'); // 'efficiency', 'models', 'attribution', 'tools', 'projects', 'sessions'
      const [autoRefresh, setAutoRefresh] = useState(false);
      const [lastUpdated, setLastUpdated] = useState('');

      // 数据状态
      const [summary, setSummary] = useState(null);
      const [usage, setUsage] = useState(null);
      const [codeStats, setCodeStats] = useState(null);
      const [attribution, setAttribution] = useState(null);
      const [timeseries, setTimeseries] = useState([]);
      const [models, setModels] = useState([]);
      const [tools, setTools] = useState([]);
      const [projects, setProjects] = useState([]);
      const [mcp, setMcp] = useState([]);
      const [skills, setSkills] = useState([]);
      const [sessions, setSessions] = useState([]);

      // 会话检索与过滤
      const [sessionSearch, setSessionSearch] = useState('');
      const [sessionAgentFilter, setSessionAgentFilter] = useState('all');
      const [sessionPage, setSessionPage] = useState(1);
      const pageSize = 15;

      // 加载所有数据
      const fetchAllData = async () => {
        try {
          const [
            sumRes,
            usageRes,
            codeRes,
            attrRes,
            tsRes,
            modelRes,
            toolRes,
            projRes,
            mcpRes,
            skillRes,
            sessRes
          ] = await Promise.all([
            fetch('/api/summary').then(r => r.json()).catch(() => null),
            fetch('/api/usage').then(r => r.json()).catch(() => null),
            fetch('/api/code').then(r => r.json()).catch(() => null),
            fetch('/api/attribution').then(r => r.json()).catch(() => null),
            fetch(`/api/timeseries?period=${period}`).then(r => r.json()).catch(() => null),
            fetch('/api/models').then(r => r.json()).catch(() => []),
            fetch('/api/tools').then(r => r.json()).catch(() => []),
            fetch('/api/projects').then(r => r.json()).catch(() => []),
            fetch('/api/mcp').then(r => r.json()).catch(() => []),
            fetch('/api/skills').then(r => r.json()).catch(() => []),
            fetch('/api/sessions').then(r => r.json()).catch(() => [])
          ]);

          if (sumRes) setSummary(sumRes);
          if (usageRes) setUsage(usageRes);
          if (codeRes) setCodeStats(codeRes);
          if (attrRes) setAttribution(attrRes);
          if (tsRes && tsRes.rows) setTimeseries(tsRes.rows);
          if (Array.isArray(modelRes)) setModels(modelRes);
          if (Array.isArray(toolRes)) setTools(toolRes);
          if (Array.isArray(projRes)) setProjects(projRes);
          if (Array.isArray(mcpRes)) setMcp(mcpRes);
          if (Array.isArray(skillRes)) setSkills(skillRes);
          if (Array.isArray(sessRes)) setSessions(sessRes);

          setLastUpdated(new Date().toLocaleTimeString());
        } catch (err) {
          console.error("加载数据失败", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchAllData();
      }, [period]);

      useEffect(() => {
        if (!autoRefresh) return;
        const timer = setInterval(() => {
          fetchAllData();
        }, 30000);
        return () => clearInterval(timer);
      }, [autoRefresh, period]);

      // 过滤后的会话记录
      const filteredSessions = useMemo(() => {
        return sessions.filter(s => {
          const matchSource = sessionAgentFilter === 'all' || s.source === sessionAgentFilter;
          const matchKeyword = !sessionSearch || 
            (s.session_id && s.session_id.toLowerCase().includes(sessionSearch.toLowerCase())) ||
            (s.cwd && s.cwd.toLowerCase().includes(sessionSearch.toLowerCase())) ||
            (s.models && s.models.toLowerCase().includes(sessionSearch.toLowerCase()));
          return matchSource && matchKeyword;
        });
      }, [sessions, sessionSearch, sessionAgentFilter]);

      const paginatedSessions = useMemo(() => {
        const start = (sessionPage - 1) * pageSize;
        return filteredSessions.slice(start, start + pageSize);
      }, [filteredSessions, sessionPage]);

      // 导出数据为 JSON / CSV
      const exportCSV = () => {
        if (!sessions || sessions.length === 0) return;
        const headers = ["SessionID", "Source", "StartedAt", "Models", "InputTokens", "OutputTokens", "ToolCalls", "CodeChanges", "WorkDir"];
        const rows = sessions.map(s => [
          `"${s.session_id}"`,
          `"${s.source}"`,
          `"${s.started_at}"`,
          `"${s.models || ''}"`,
          s.input_tokens || 0,
          s.output_tokens || 0,
          s.tool_calls || 0,
          s.code_changes || 0,
          `"${(s.cwd || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `agentstat_sessions_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 图表配置：每日/每周 产出与会话效能组合图
      const efficiencyChartOption = useMemo(() => {
        const sorted = [...timeseries].sort((a, b) => a.period_start.localeCompare(b.period_start));
        const dates = sorted.map(d => d.period_start);
        const linesAdded = sorted.map(d => d.lines_added);
        const linesDeleted = sorted.map(d => d.lines_deleted);
        const sessionCount = sorted.map(d => d.sessions);
        const codeChanges = sorted.map(d => d.code_changes);

        return {
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' }
          },
          legend: {
            data: ['新增代码行', '删除代码行', '会话次数 (Sessions)', '代码变更事件'],
            textStyle: { color: '#94a3b8' },
            top: 0
          },
          grid: { left: '3%', right: '4%', bottom: '8%', top: '15%', containLabel: true },
          xAxis: {
            type: 'category',
            data: dates,
            axisLine: { lineStyle: { color: '#334155' } },
            axisLabel: { color: '#94a3b8', fontSize: 11 }
          },
          yAxis: [
            {
              type: 'value',
              name: '代码行数',
              nameTextStyle: { color: '#94a3b8' },
              axisLine: { lineStyle: { color: '#334155' } },
              splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
              axisLabel: { color: '#94a3b8' }
            },
            {
              type: 'value',
              name: '会话/事件数',
              nameTextStyle: { color: '#94a3b8' },
              axisLine: { lineStyle: { color: '#334155' } },
              splitLine: { show: false },
              axisLabel: { color: '#94a3b8' }
            }
          ],
          series: [
            {
              name: '新增代码行',
              type: 'bar',
              stack: 'lines',
              itemStyle: { color: '#10b981', borderRadius: [0, 0, 0, 0] },
              data: linesAdded
            },
            {
              name: '删除代码行',
              type: 'bar',
              stack: 'lines',
              itemStyle: { color: '#f43f5e', borderRadius: [4, 4, 0, 0] },
              data: linesDeleted
            },
            {

                    </div>

                    <div>
                      <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '6px'}}>
                        <span style={{fontSize: '13px', color: '#94a3b8'}}>业务核心代码采纳率</span>
                        <span style={{fontSize: '14px', fontWeight: 700, color: '#10b981'}}>
                          {attribution?.business_acceptance_rate?.toFixed(2)}% ({attribution?.business_accepted_lines} / {attribution?.business_candidate_lines} 行)
                        </span>
                      </div>
                      <div className="progress-bar-bg">
                        <div className="progress-bar-fill" style={{width: `${attribution?.business_acceptance_rate || 0}%`, background: 'linear-gradient(90deg, #10b981, #059669)'}}></div>
                      </div>
                    </div>

                    <div>
                      <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '6px'}}>
                        <span style={{fontSize: '13px', color: '#94a3b8'}}>技术文档与注释采纳率</span>
                        <span style={{fontSize: '14px', fontWeight: 700, color: '#a855f7'}}>
                          {attribution?.documentation_candidate_lines > 0 
                            ? ((attribution.documentation_accepted_lines / attribution.documentation_candidate_lines) * 100).toFixed(2)
                            : 0}% ({attribution?.documentation_accepted_lines} / {attribution?.documentation_candidate_lines} 行)
                        </span>
                      </div>
                      <div className="progress-bar-bg">
                        <div className="progress-bar-fill" style={{width: `${attribution?.documentation_candidate_lines > 0 ? (attribution.documentation_accepted_lines / attribution.documentation_candidate_lines) * 100 : 0}%`, background: 'linear-gradient(90deg, #a855f7, #7c3aed)'}}></div>
                      </div>
                    </div>

                    <div style={{background: 'rgba(255,255,255,0.02)', border: '1px solid var(--border-subtle)', padding: '12px', borderRadius: '8px', marginTop: '8px'}}>
                      <p style={{fontSize: '12px', color: '#94a3b8', lineHeight: 1.6}}>
                        💡 <b>归因算法原理</b>：AgentStat 采用内存级行指纹哈希（SHA-256）与实际 Git 提交历史做保守比对，不持久化敏感源码，只统计实际采纳入库的新增非空行。
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              {/* 代码分类指标详细表格 */}
              <div className="panel">
                <div className="panel-header">
                  <h2 className="panel-title">📋 代码产出与分类指标明细</h2>
                </div>
                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>代码分类</th>
                        <th>Agent 产出新增行数</th>
                        <th>Git 归因候选行数</th>
                        <th>最终保留采纳行数</th>
                        <th>分类采纳率</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><span className="badge badge-blue">业务逻辑代码 (Business)</span></td>
                        <td>+{formatNumber(codeStats?.business_lines_added)}</td>
                        <td>{formatNumber(attribution?.business_candidate_lines)}</td>
                        <td style={{color: '#10b981', fontWeight: 600}}>{formatNumber(attribution?.business_accepted_lines)}</td>
                        <td style={{fontWeight: 700, color: '#38bdf8'}}>{attribution?.business_acceptance_rate?.toFixed(2)}%</td>
                      </tr>
                      <tr>
                        <td><span className="badge badge-emerald">单元与集成测试 (Tests)</span></td>
                        <td>+{formatNumber(codeStats?.test_lines_added)}</td>
                        <td>{formatNumber(attribution?.test_candidate_lines)}</td>
                        <td style={{color: '#10b981', fontWeight: 600}}>{formatNumber(attribution?.test_accepted_lines)}</td>
                        <td style={{fontWeight: 700, color: '#10b981'}}>
                          {attribution?.test_candidate_lines > 0 ? ((attribution.test_accepted_lines / attribution.test_candidate_lines) * 100).toFixed(2) : 0}%
                        </td>
                      </tr>
                      <tr>
                        <td><span className="badge badge-purple">技术文档与注释 (Docs)</span></td>
                        <td>+{formatNumber(codeStats?.documentation_lines_added)}</td>
                        <td>{formatNumber(attribution?.documentation_candidate_lines)}</td>
                        <td style={{color: '#10b981', fontWeight: 600}}>{formatNumber(attribution?.documentation_accepted_lines)}</td>
                        <td style={{fontWeight: 700, color: '#a855f7'}}>
                          {attribution?.documentation_candidate_lines > 0 ? ((attribution.documentation_accepted_lines / attribution.documentation_candidate_lines) * 100).toFixed(2) : 0}%
                        </td>
                      </tr>
                      <tr>
                        <td><span className="badge badge-amber">自动生成与脚手架 (Generated)</span></td>
                        <td>+{formatNumber(codeStats?.generated_lines_added)}</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                      </tr>
                      <tr>
                        <td><span className="badge" style={{background: '#334155', color: '#cbd5e1'}}>配置与其他 (Other)</span></td>
                        <td>+{formatNumber(codeStats?.other_lines_added)}</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Tab 4: 工具 / MCP / Skills 调用 */}
          {activeTab === 'tools' && (
            <div>
              <div className="panel">
                <div className="panel-header">
                  <div>
                    <h2 className="panel-title">🏆 高频工具调用分布排行榜 (Top 15)</h2>
                    <p className="panel-subtitle">Agent 在解决问题时最常调用的编辑、查找、执行与 MCP 工具</p>
                  </div>
                </div>
                <EChartComponent option={toolsBarOption} height="420px" />
              </div>

              <div className="grid-2">
                {/* MCP 能力列表 */}
                <div className="panel">
                  <div className="panel-header">
                    <h2 className="panel-title">🧩 MCP 外部服务扩展调用</h2>
                  </div>
                  {mcp.length === 0 ? (
                    <div className="empty-state">暂无 MCP 扩展调用记录</div>
                  ) : (
                    <div className="table-container">
                      <table>
                        <thead>
                          <tr>
                            <th>服务名称</th>
                            <th>来源</th>
                            <th>调用次数</th>
                          </tr>
                        </thead>
                        <tbody>
                          {mcp.map((item, idx) => (
                            <tr key={idx}>
                              <td className="mono" style={{fontWeight: 600}}>{item.name}</td>
                              <td><span className="badge badge-blue">{item.source}</span></td>
                              <td style={{fontWeight: 600, color: '#38bdf8'}}>{item.calls}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* Skills 技能列表 */}
                <div className="panel">
                  <div className="panel-header">
                    <h2 className="panel-title">💡 Agent Skills 技能调用</h2>
                  </div>
                  {skills.length === 0 ? (
                    <div className="empty-state">暂无 Skills 技能记录</div>
                  ) : (
                    <div className="table-container">
                      <table>
                        <thead>
                          <tr>
                            <th>技能名称</th>
                            <th>来源</th>
                            <th>调用次数</th>
                          </tr>
                        </thead>
                        <tbody>
                          {skills.map((item, idx) => (
                            <tr key={idx}>
                              <td className="mono" style={{fontWeight: 600}}>{item.name}</td>
                              <td><span className="badge badge-purple">{item.source}</span></td>
                              <td style={{fontWeight: 600, color: '#a855f7'}}>{item.calls}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>

              {/* 全量工具列表 */}
              <div className="panel">
                <div className="panel-header">
                  <h2 className="panel-title">📋 工具全量调用明细表</h2>
                </div>
                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>工具名称</th>
                        <th>详情/类别</th>
                        <th>调用次数</th>
                        <th>MCP 调用数</th>
                      </tr>
                    </thead>
                    <tbody>
                      {tools.map((t, idx) => (
                        <tr key={idx}>
                          <td className="mono" style={{fontWeight: 600}}>{t.tool_name}</td>
                          <td className="mono" style={{color: '#94a3b8'}}>{t.detail_name || '-'}</td>
                          <td style={{fontWeight: 600}}>{formatNumber(t.calls)}</td>
                          <td>{t.mcp_calls > 0 ? <span className="badge badge-emerald">{t.mcp_calls}</span> : '0'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Tab 5: 项目工作区 */}
          {activeTab === 'projects' && (
            <div>
              <div className="panel">
                <div className="panel-header">
                  <h2 className="panel-title">📁 本地项目工作区分析</h2>
                </div>
                <div className="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>项目名称</th>
                        <th>工作目录路径</th>
                        <th>会话数</th>
                        <th>跨 Agent 来源数</th>
                        <th>输入 Token</th>
                        <th>输出 Token</th>
                        <th>工具调用</th>
                        <th>代码变更</th>
                      </tr>
                    </thead>
                    <tbody>
                      {projects.map((p, idx) => (
                        <tr key={idx}>
                          <td style={{fontWeight: 600, color: '#38bdf8'}}>{p.project || '默认项目'}</td>
                          <td className="mono" style={{fontSize: '12px', color: '#94a3b8'}}>{p.project_path}</td>
                          <td>{p.sessions}</td>
                          <td>{p.sources}</td>
                          <td>{formatTokens(p.input_tokens)}</td>
                          <td>{formatTokens(p.output_tokens)}</td>
                          <td>{p.tool_calls}</td>
                          <td style={{color: '#10b981', fontWeight: 600}}>{p.code_changes}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Tab 6: 详细会话流水台账 */}
          {activeTab === 'sessions' && (
            <div>
              <div className="panel">
                <div className="panel-header">
                  <h2 className="panel-title">📜 详细会话流水台账</h2>
                </div>

                {/* 搜索与过滤工具栏 */}
                <div className="filter-bar">
                  <input
                    type="text"
                    className="search-input"
                    placeholder="🔍 搜索会话 ID / 路径 / 模型名称..."
                    value={sessionSearch}
                    onChange={e => {
                      setSessionSearch(e.target.value);
                      setSessionPage(1);
                    }}
                  />

                  <select
                    className="select-input"
                    value={sessionAgentFilter}
                    onChange={e => {
                      setSessionAgentFilter(e.target.value);
                      setSessionPage(1);
                    }}
                  >
                    <option value="all">全部 Agent 来源</option>
                    <option value="codex">Codex</option>
                    <option value="claude">Claude Code</option>
                    <option value="antigravity">Antigravity</option>
                  </select>

                  <span style={{fontSize: '13px', color: '#94a3b8', marginLeft: 'auto'}}>
                    共匹配到 <b>{filteredSessions.length}</b> 条会话
                  </span>
                </div>

                {/* 会话列表 */}
                {paginatedSessions.length === 0 ? (
                  <div className="empty-state">未找到匹配的会话记录</div>
                ) : (
                  <div>
                    {paginatedSessions.map((s, idx) => (
                      <div className="session-item" key={idx}>
                        <div className="session-item-header">
                          <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                            <span className="mono" style={{fontWeight: 700, color: '#f1f5f9'}}>{s.session_id}</span>
                            <span className={`badge ${s.source === 'claude' ? 'badge-amber' : s.source === 'codex' ? 'badge-blue' : 'badge-purple'}`}>
                              {s.source}
                            </span>
                            {s.models && (
                              <span className="badge" style={{background: 'rgba(255,255,255,0.06)', color: '#cbd5e1'}}>
                                {s.models}
                              </span>
                            )}
                          </div>
                          <span style={{fontSize: '12px', color: '#64748b'}}>{s.started_at}</span>
                        </div>

                        <div className="mono" style={{fontSize: '12px', color: '#94a3b8', wordBreak: 'break-all'}}>
                          📁 {s.cwd || '未指定目录'}
                        </div>

                        <div className="session-metrics">
                          <div>输入 Token: <span className="session-metric-val">{formatTokens(s.input_tokens)}</span></div>
                          <div>输出 Token: <span className="session-metric-val">{formatTokens(s.output_tokens)}</span></div>
                          <div>工具调用: <span className="session-metric-val">{s.tool_calls || 0}</span> 次</div>
                          <div>代码变更: <span className="session-metric-val" style={{color: '#10b981'}}>{s.code_changes || 0}</span> 次</div>
                        </div>
                      </div>
                    ))}

                    {/* 分页器 */}
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '20px'}}>
                      <span style={{fontSize: '13px', color: '#94a3b8'}}>
                        第 {sessionPage} / {Math.ceil(filteredSessions.length / pageSize) || 1} 页
                      </span>
                      <div style={{display: 'flex', gap: '8px'}}>
                        <button
                          className="btn"
                          disabled={sessionPage <= 1}
                          onClick={() => setSessionPage(p => Math.max(1, p - 1))}
                        >
                          上一页
                        </button>
                        <button
                          className="btn"
                          disabled={sessionPage >= Math.ceil(filteredSessions.length / pageSize)}
                          onClick={() => setSessionPage(p => p + 1)}
                        >
                          下一页
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
